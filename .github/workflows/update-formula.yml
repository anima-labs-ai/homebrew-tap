name: Update formula

# Keeps Formula/anima.rb pointed at the latest @anima-labs/cli release on
# the npm registry.
#
# Triggers:
#   - repository_dispatch `cli-release`: sent by the CLI repo's release
#     workflow right after `npm publish`, so the formula updates within
#     minutes of a release. The dispatch is a pure wake-up signal — this
#     workflow NEVER reads client_payload (repository_dispatch payloads are
#     writable by anyone with a token that can send the event, so nothing
#     here trusts them). The version is resolved from the npm registry.
#   - schedule: safety net every 6 hours in case the dispatch was skipped
#     (e.g. HOMEBREW_TAP_TOKEN not configured in the CLI repo).
#   - workflow_dispatch: manual runs.
#
# The formula is fully regenerated from the template below — no sed
# patching — and validated with a real `brew install` + version check
# before the push, so a broken formula can't land on the tap.

on:
  repository_dispatch:
    types: [cli-release]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Full history: the checkout doubles as the local tap during
      # validation, and Homebrew refuses to work with shallow tap clones.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve latest version from npm
        id: version
        run: |
          version="$(npm view @anima-labs/cli version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::npm returned an unexpected version string: '$version'"
            exit 1
          fi
          current="$(grep -Eo 'cli-[0-9]+\.[0-9]+\.[0-9]+\.tgz' Formula/anima.rb | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "npm latest: $version — formula: ${current:-none}"

      - name: Regenerate formula
        if: steps.version.outputs.version != steps.version.outputs.current
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://registry.npmjs.org/@anima-labs/cli/-/cli-${VERSION}.tgz"
          curl -fsSL "$url" -o /tmp/anima-cli.tgz
          sha="$(sha256sum /tmp/anima-cli.tgz | awk '{print $1}')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::sha256 computation failed"
            exit 1
          fi
          cat > Formula/anima.rb <<EOF
          # This formula is auto-generated by .github/workflows/update-formula.yml,
          # which tracks the latest @anima-labs/cli release on the npm registry.
          # Manual edits will be overwritten on the next release.
          class Anima < Formula
            desc "Official CLI for the Anima platform — identity infrastructure for AI agents"
            homepage "https://useanima.sh"
            url "$url"
            sha256 "$sha"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/anima --version")
            end
          end
          EOF
          cat Formula/anima.rb

      - name: Validate — brew install from the regenerated formula
        if: steps.version.outputs.version != steps.version.outputs.current
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          # Homebrew refuses to install formula files by path — formulae must
          # live in a tap. Register THIS checkout (with the just-regenerated
          # formula) as the tap by symlinking it into brew's taps dir; a
          # network `brew tap` would clone the old formula from GitHub and
          # defeat pre-push validation.
          tap_dir="$(brew --repository)/Library/Taps/anima-labs-ai/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
          brew install anima-labs-ai/tap/anima
          installed="$("$(brew --prefix)/bin/anima" --version)"
          echo "anima --version -> $installed"
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::Installed version '$installed' does not match expected '$VERSION'"
            exit 1
          fi

      - name: Commit and push
        if: steps.version.outputs.version != steps.version.outputs.current
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/anima.rb
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "anima $VERSION"
          git push
